<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo oscuro obsidiana -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>

    <!-- Gradiente verde esmeralda neón característico de NEXO -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="30%" stop-color="#00E599"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gradiente metálico titanio / blanco para los pilares -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Resplandor esmeralda central -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00E599" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00E599" stop-opacity="0"/>
    </radialGradient>

    <!-- Borde exterior sutil con brillo verde -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Sombra suave para dar volumen -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Contenedor cuadrado con esquinas redondeadas (Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#centerGlow)"/>

  <!-- Letra N y X de NEXO estilizadas en 3D -->
  <g filter="url(#glow)">
    <!-- Pilar Izquierdo de N (Titanio Plateado) -->
    <path d="M24 30 C24 26.686 26.686 24 30 24 H40 C43.314 24 46 26.686 46 30 V98 C46 101.314 43.314 104 40 104 H30 C26.686 104 24 101.314 24 98 Z" fill="url(#titaniumGrad)"/>

    <!-- Pilar Derecho de N (Titanio Plateado) -->
    <path d="M82 30 C82 26.686 84.686 24 88 24 H98 C101.314 24 104 26.686 104 30 V98 C104 101.314 101.314 104 98 104 H88 C84.686 104 82 101.314 82 98 Z" fill="url(#titaniumGrad)"/>

    <!-- Diagonal Verde 2 (Cruce de la X) -->
    <path d="M88 26 L40 102 H28 L76 26 Z" fill="#064E3B" opacity="0.8"/>
    <path d="M86 28 L42 100" stroke="#047857" stroke-width="12" stroke-linecap="round"/>

    <!-- Diagonal Principal de N (que forma el aspa brillante de la X) -->
    <path d="M38 26 L88 102" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Cruce brillante frontal de la X -->
    <path d="M86 28 L42 100" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="24 20 24"/>

    <!-- Núcleo diamantado central resplandeciente -->
    <polygon points="64,56 72,64 64,72 56,64" fill="#A7F3D0"/>
    <circle cx="64" cy="64" r="3" fill="#FFFFFF"/>
  </g>
</svg>
